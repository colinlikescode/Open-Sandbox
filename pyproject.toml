[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opensandbox"
version = "0.2.0"
description = "Self-hosted gVisor sandboxes on existing Linux CPU machines, managed by Kubernetes."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.15"
authors = [{ name = "OpenSandbox contributors" }]
keywords = ["sandbox", "gvisor", "kubernetes", "agents", "k3s"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27,<1",
  "websockets>=14.0",
  "typer>=0.12",
  "rich>=13.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "aiosqlite>=0.20",
  "psutil>=5.9",
  "prometheus-client>=0.20",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9",
  "pathspec>=0.12",
  "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "types-psutil",
  "build>=1.2",
  "e2b==2.51.0",
]

[project.scripts]
opensandbox = "opensandbox.cli:main"
opensandbox-server = "opensandbox.api:main"

[project.urls]
Homepage = "https://github.com/colinlikescode/Open-Daytona-Sandbox"
Documentation = "https://github.com/colinlikescode/Open-Daytona-Sandbox/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/opensandbox"]

[tool.hatch.build.targets.sdist]
include = ["src/opensandbox", "agent", "README.md", "instructions.md", "LICENSE", "docs", "examples", "uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PL"]
ignore = [
  "PLR0913", # many args in constructors is fine for config-heavy code
  "PLR2004", # magic values
  "PLR0912", "PLR0915", "PLR0911", # complexity: handled by review
  "S101",    # asserts in tests
  "S603", "S607", # subprocess with argument arrays is intended
  "S104",    # binding 0.0.0.0 is an explicit, authenticated option
  "RUF012",
  "B008",    # typer.Option in defaults
  "ASYNC109", # explicit timeouts are part of the API surface
  "ASYNC110",
  "PLC0415", # local imports used for optional deps
  "S108",    # /tmp paths inside sandboxes are intended
  "E501",
  "N818",
  "SIM117",
  "B904",
  "S311",    # random used only for non-security jitter, secrets used for tokens
  "PLW0603", "PLW2901",
  "S324",
  "S110",
  "S105", "S106", "S107",
  "RUF006",
  "S310",
  "PLR1714",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PL", "B", "RUF", "ASYNC", "SIM"]
"src/opensandbox/api/routes/**" = ["PLR0917"]
"src/opensandbox/cli/**" = ["PLR0917"]  # FastAPI handlers take path/query params positionally

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src/opensandbox"]
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 120
markers = [
  "cluster: requires an installed Linux K3s/gVisor cluster",
]
addopts = "-m 'not cluster'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["opensandbox"]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
